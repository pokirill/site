# /etc/nginx/sites-enabled/kubysh-web.conf on 201.24.56.21 (before certbot).
# certbot --nginx adds the 443 listeners and http→https redirects itself.

server {
    listen 80;
    listen [::]:80;
    server_name kubysh.com www.kubysh.com pay.kubysh.com;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
