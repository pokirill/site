# Container nginx for kubysh.com and pay.kubysh.com.
# TLS terminates on the host nginx (certbot) and is proxied here with the
# original Host header. Keep host routing explicit: an unknown host gets 404,
# never the landing or the payment page.

server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name www.kubysh.com;
    return 301 https://kubysh.com$request_uri;
}

server {
    listen 80;
    server_name kubysh.com;

    root /srv/www/kubysh;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Landing files are small and deployment correctness matters more than a
    # long browser TTL. Conditional revalidation still avoids waste.
    add_header Cache-Control "no-cache, must-revalidate" always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

server {
    listen 80;
    server_name pay.kubysh.com;

    root /srv/www/pay;
    index index.html;

    # Keep every header at server level: nginx stops inheriting add_header
    # directives when a child location defines its own add_header.
    add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; form-action 'self' https://appleid.apple.com; frame-ancestors 'none'; script-src 'self' https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.kubysh.com https://appleid.apple.com; frame-src https://appleid.apple.com; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # A stale account page shows the wrong subscription state.
    add_header Cache-Control "no-store, must-revalidate" always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
